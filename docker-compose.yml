services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trustshare:${POSTGRES_PASSWORD:-trustshare_dev}@postgres:5432/trustshare
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongo:27017
      S3_ENDPOINT_URL: http://minio:9000
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mongo: {condition: service_healthy}
      minio: {condition: service_healthy}
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trustshare
      POSTGRES_USER: trustshare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustshare_dev}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustshare -d trustshare"]
      interval: 5s
      timeout: 3s
      retries: 20
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data:
