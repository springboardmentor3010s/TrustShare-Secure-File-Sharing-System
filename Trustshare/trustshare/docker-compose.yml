services:
  postgres:
    image: postgres:16-alpine
    container_name: trustshare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trustshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustshare_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-trustshare}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trustshare} -d ${POSTGRES_DB:-trustshare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: trustshare-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-trustshare}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./backend/scripts/init_mongo.js:/docker-entrypoint-initdb.d/init_mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: trustshare-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustshare-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-TrustShare}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trustshare}:${POSTGRES_PASSWORD:-trustshare_dev_pass}@postgres:5432/${POSTGRES_DB:-trustshare}
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: ${MONGODB_DB:-trustshare}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-prod-use-openssl-rand-hex-32-trustshare-m1}
      MASTER_KEK_B64: ${MASTER_KEK_B64:-VHJ1c3RTaGFyZURldk1hc3RlcktFSzMyQnl0ZXM5OTE=}
      ENCRYPTION_ENABLED: ${ENCRYPTION_ENABLED:-true}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_DIR: /app/data/encrypted_objects
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - encrypted_storage:/app/data/encrypted_objects

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustshare-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  encrypted_storage:
